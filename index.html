<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Caja Toro Negro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra superior con logo y pestañas desplazables; cada sección es una columna de tarjetas con formulario arriba y lista abajo. */
:root{
  --bg:#f5f4f2; --surface:#ffffff; --surface-2:#efedea; --line:#dedad5;
  --fg:#1d1b19; --muted:#6e6862; --accent:#d9561e; --accent-ink:#ffffff; --accent-soft:#fbe6dc;
  --good:#1f7a4a; --good-soft:#dff1e6; --warn:#a86a00; --warn-soft:#fbefd4; --bad:#b3261e; --bad-soft:#f9dedc;
  --display:"Cinzel", Georgia, "Times New Roman", serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141312; --surface:#1d1b1a; --surface-2:#262422; --line:#363330;
  --fg:#f1eeea; --muted:#a59e97; --accent:#f07a3f; --accent-ink:#1a0d06; --accent-soft:#3a2216;
  --good:#5cc48b; --good-soft:#18301f; --warn:#e2b04a; --warn-soft:#352a12; --bad:#f08a80; --bad-soft:#3a1a18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1d1b1a; --surface-2:#262422; --line:#363330;
  --fg:#f1eeea; --muted:#a59e97; --accent:#f07a3f; --accent-ink:#1a0d06; --accent-soft:#3a2216;
  --good:#5cc48b; --good-soft:#18301f; --warn:#e2b04a; --warn-soft:#352a12; --bad:#f08a80; --bad-soft:#3a1a18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.brand{display:flex;align-items:center;gap:10px}
.logo{height:30px;width:auto;border-radius:6px;background:#fff;padding:2px 4px}
.brand h1{font-family:var(--display);font-size:17px;letter-spacing:.06em;margin:0;text-wrap:balance}
.brand .sub{color:var(--muted);font-size:12px;margin-left:auto;text-align:right}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:8px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
main{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;display:grid;gap:16px}
h2{font-size:18px;margin:0;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 10px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.tile .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tile .num{font-size:24px;font-weight:700;margin-top:4px}
.tile .note{color:var(--muted);font-size:12px;margin-top:2px}
.row2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
form.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
form.f .wide{grid-column:1/-1}
label.fl{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.b{font:inherit;font-weight:600;border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer}
button.b.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.b.small{padding:4px 10px;font-size:12px}
button.b.danger{color:var(--bad)}
button.b:disabled{opacity:.5;cursor:default}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--surface-2);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:12px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.empty{color:var(--muted);padding:12px 0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.toolbar input,.toolbar select{width:auto;min-width:0;flex:1 1 160px;max-width:260px}
.week{display:grid;gap:8px}
.week .d{display:grid;grid-template-columns:minmax(90px,1.2fr) 1fr 1fr minmax(80px,.8fr);gap:8px;align-items:center}
.week .d.hd{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.week input.dirty{background:var(--warn-soft);border-color:var(--warn)}
.status{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-weight:600;z-index:20}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.plegable{all:unset;box-sizing:border-box;display:flex;width:100%;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:10px}
.card.plegada{padding-top:10px;padding-bottom:10px}.card.plegada .plegable{margin:0}.plegable:focus-visible{outline:2px solid var(--acc,#d4561e);outline-offset:4px;border-radius:4px}
.ficha .bloques{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}
.ficha .bloque{border:1px solid var(--line,#e5e2dc);border-radius:10px;padding:10px 12px;min-width:0}
.ficha .bloque h3{margin:0 0 8px}.ficha dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0}
.ficha dt{color:var(--mute,#7a746c);font-size:.85em;padding-top:1px}.ficha dd .pill{white-space:normal;display:inline-block}.ficha dd{margin:0;min-width:0;overflow-wrap:anywhere}
.recien{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--good-soft,#e8f3ec)}
.lnk{color:inherit;text-decoration:underline;text-decoration-color:var(--line,#ccc);text-underline-offset:3px}.lnk:hover{text-decoration-color:currentColor}
.login{max-width:380px;margin:40px auto 0;display:grid;gap:12px}
.login .logo-big{height:64px;width:auto;justify-self:center;border-radius:8px;background:#fff;padding:4px 8px}
.who{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<script>
(() => {
"use strict";
/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf0 = new Intl.NumberFormat("es-UY", {maximumFractionDigits: 0});
const nf2 = new Intl.NumberFormat("es-UY", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pesos = n => (n == null || isNaN(n)) ? "—" : (n < 0 ? "-$ " : "$ ") + nf0.format(Math.abs(Math.round(n)));
const usd = n => (n == null || isNaN(n)) ? "—" : "US$ " + nf2.format(n);
const money = (n, m) => m === "US$" ? usd(n) : pesos(n);
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => iso(new Date());
const parseISO = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); };
const fmtD = s => { if (!s) return "—"; const [y, m, d] = String(s).split("-"); return d + "/" + m + "/" + y; };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
const monday = s => { const d = parseISO(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return iso(d); };
const nextMonday = s => { const d = parseISO(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() + (7 - w)); return iso(d); };
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const dia = s => DIAS[parseISO(s).getDay()];
const num = v => { if (v === "" || v == null) return null; const n = Number(String(v).replace(/\./g, "").replace(",", ".")); return isNaN(n) ? null : n; };
const numIn = v => { if (v === "" || v == null) return null; const s = String(v).trim().replace(/^\$\s*/, "").replace(/\s/g, ""); const n = Number(s.includes(",") ? s.replace(/\./g, "").replace(",", ".") : /^\d{1,3}(\.\d{3})+$/.test(s) ? s.replace(/\./g, "") : s); return isNaN(n) ? null : n; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
let toastT;
const toast = msg => { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); };

/* ---------- estado ---------- */
const COLS = ["personal","personalPrivado","movimientos","adelantos","cajaFuerte","arqueos","propinas","semanasPropina","pagos","pendientesDrive"];
const S = {cfg: {cotizacion: 41, diasAcreditacion: 15}, ready: {}, canWrite: true};
COLS.forEach(c => S[c] = []);
let db = null, dl = true;
let tab = "resumen";
const ui = {editing: {}, propDraft: {}, formasDraft: null, formasFor: null, gruposAbiertos: new Set(), adelPara: null, perEditar: false, bajaAbierta: null, bpsVer: false, bpsRecien: [], personalQ: "", personalEstado: "activos", personalSector: "", ocultarSueldos: true, pagosEstado: "pendiente", semana: monday(today()), movSemana: ""};

const TABS = [["resumen","Resumen"],["caja","Fondo de dueños"],["fuerte","Retiros de caja"],["adelantos","Adelantos"],["propinas","Propinas"],["personal","Personal"],["pagos","Pagos y vencimientos"],["ajustes","Ajustes"],["usuarios","Usuarios"]];

/* ---------- cálculos ---------- */
const enPesos = (monto, moneda, cot) => moneda === "US$" ? (monto || 0) * (cot || S.cfg.cotizacion) : (monto || 0);
function cajaTotales(desde) {
  let ing = 0, egr = 0, ajm = 0;
  S.movimientos.forEach(m => { if (desde && m.fecha < desde) return; if (m.estado === "Pendiente de pago") return; const v = enPesos(m.monto, m.moneda, m.cotizacion); if (m.categoria === "Ajuste") ajm += m.tipo === "Ingreso" ? v : -v; else if (m.tipo === "Ingreso") ing += v; else egr += v; });
  let adel = 0;
  S.adelantos.forEach(a => { if (a.estado !== "Entregado" || deRetiros(a)) return; if (desde && a.fecha < desde) return; adel += a.monto || 0; });
  const aj = desde ? 0 : ajusteArq("Fondo de dueños").pesos;
  return {ing, egr: egr + adel, adel, ajuste: aj, ajusteMov: ajm, saldo: ing - egr - adel + aj + ajm};
}
function ajusteArq(cuenta) {
  let pesos = 0, usd = 0;
  (S.arqueos || []).forEach(a => { if ((a.cuenta || "Fondo de dueños") !== cuenta) return; pesos += (a.contado || 0) - (a.saldoSistema || 0); if (a.contadoUsd != null) usd += (a.contadoUsd || 0) - (a.saldoUsd || 0); });
  return {pesos, usd};
}
const deRetiros = a => a.origen === "Retiros de caja";
const movPend = () => S.movimientos.filter(m => m.estado === "Pendiente de pago");
function fuerteTotales() {
  let p = 0, u = 0;
  S.cajaFuerte.forEach(x => { const s = x.tipo === "Salida" ? -1 : 1; p += s * (x.pesos || 0); u += s * (x.dolares || 0); });
  S.adelantos.forEach(a => { if (a.estado === "Entregado" && deRetiros(a)) p -= a.monto || 0; });
  const aj = ajusteArq("Retiros de caja"); p += aj.pesos; u += aj.usd;
  return {pesos: p, usd: u, equiv: p + u * S.cfg.cotizacion};
}

function vencPill(v) {
  if (!v) return `<span class="pill mute">sin fecha</span>`;
  const t = today();
  if (v < t) return `<span class="pill bad">${fmtD(v)} vencido</span>`;
  if (v <= addDays(t, 3)) return `<span class="pill warn">${fmtD(v)}</span>`;
  return `<span class="pill mute">${fmtD(v)}</span>`;
}

function vAdelantos() {

  const desc = sortBy(S.adelantos.filter(a => a.estado === "Entregado" && a.descontado), "fecha", -1);
  const porEmp = {}; sinDesc.forEach(a => porEmp[adelKey(a)] = (porEmp[adelKey(a)] || 0) + (a.monto || 0));
  const row = (a, btn, sub) => `<tr${sub ? ' class="subPago" style="border-left:3px solid var(--line, #ccc)"' : ""}><td>${fmtD(a.fecha)}</td><td class="click" data-act="editAdel" data-id="${a.id}">${sub ? "" : esc(nombreAdel(a))}<div class="muted small">${esc(a.notas || "")}</div></td><td class="n">${pesos(a.monto)}</td><td class="n">${btn}</td></tr>`;
  const tbl = (list, btn, emptyTxt, sec) => {
    if (!list.length) return `<div class="empty">${emptyTxt}</div>`;
    const g = {}; list.forEach(a => (g[adelKey(a)] ||= []).push(a));
    const hechos = new Set(), out = [];
    for (const a of list) {
      const k = adelKey(a), grp = g[k];
      if (grp.length < 2) { out.push(row(a, btn(a))); continue; }
      if (hechos.has(k)) continue; hechos.add(k);
      const gk = "adel|" + sec + "|" + k, abierto = ui.gruposAbiertos.has(gk);
      out.push(`<tr class="click grupoPago" data-act="toggleGrupo" data-id="${esc(gk)}" style="background:var(--soft, rgba(127,127,127,.08))"><td>${fmtD(grp.map(x => x.fecha).sort().pop())}</td><td><strong>${esc(nombreAdel(a))}</strong> <span class="muted small">· ${grp.length} adelantos</span><div class="muted small">${esc(grp.map(x => fmtD(x.fecha).slice(0, 5) + " " + pesos(x.monto)).join(" · "))}</div></td><td class="n"><strong>${pesos(grp.reduce((t, x) => t + (x.monto || 0), 0))}</strong></td><td class="n"><button class="b small" type="button" data-act="toggleGrupo" data-id="${esc(gk)}">${abierto ? "Ocultar detalle" : "Ver detalle"}</button></td></tr>`);

    }
    return `<div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Empleado</th><th class="n">Monto</th><th></th></tr></thead><tbody>${out.join("")}</tbody></table></div>`;

  </div>

      ${niv("personal") >= 2 ? `<div class="fl small muted" style="align-self:end">¿No está en la lista? <button class="b small" type="button" data-act="perDesdeAdel">Crearla en Personal</button></div>` : ""}

      <label class="fl">Monto ($)<input id="ad_monto" name="monto" inputmode="decimal" required value="${e.monto ?? ""}"></label>
      <label class="fl">¿De dónde sale la plata?<select id="ad_origen" name="origen" required>${opts(["Fondo de dueños","Retiros de caja"], e.origen || "Fondo de dueños")}</select></label>
      <label class="fl">Estado<select id="ad_estado" name="estado">${opts(["Entregado","Pendiente de entrega"], e.estado || "Entregado")}</select></label>
      <label class="fl wide">Notas<input id="ad_notas" name="notas" value="${esc(e.notas || "")}"></label>
      <div class="btns wide"><button class="b primary" type="submit" ${roOnly(e.id ? 3 : 2)}>${e.id ? "Guardar cambios" : "Agregar adelanto"}</button>${e.id ? `<button class="b" type="button" data-act="cancelAdel">Cancelar</button><button class="b danger" type="button" ${roOnly(3)} data-act="delAdel" data-id="${e.id}">Borrar</button>` : ""}<span class="muted small">Un adelanto entregado se descuenta del fondo de dueños o de los retiros de caja, según lo que elijas, y se descuenta completo del sueldo siguiente.</span></div>
    </form>
  </div>
  <div class="card"><h3>Pendientes de entregar</h3>${tbl(pend, a => `<button class="b small" data-act="entregar" data-id="${a.id}" ${roOnly(3)}>Marcar entregado</button>`, "No hay adelantos pendientes de entregar.", "pend")}</div>

async function guardarPropinas() {
  const ent = Object.entries(ui.propDraft); if (!ent.length) { toast("No hay cambios para guardar"); return; }
  for (const [k, raw] of ent) { const v = numIn(raw); if (String(raw).trim() !== "" && (v == null || v < 0)) { toast("Monto no válido: " + raw); return; } }
  const btn = $("#btnProp"); if (btn) btn.disabled = true;
  let ok = true;
  for (const [k, raw] of ent) {
    const [fecha, turno] = k.split("|"); const id = fecha + "_" + (turno === "Día" ? "dia" : "noche"); const v = numIn(raw);
    if (String(raw).trim() === "") { if (propina(fecha, turno)) { try { await db.collection("propinas").doc(id).delete(); } catch (e) { ok = false; continue; } } }
    else if (!(await save("propinas", id, {fecha, turno, monto: v}))) { ok = false; continue; }
    delete ui.propDraft[k];
  }
  toast(ok ? "Propinas guardadas" : "Algunas no se pudieron guardar, probá de nuevo"); render();
}

        ${priv("sueldos") ? `<label class="small" style="display:flex;gap:6px;align-items:center;white-space:nowrap"><input type="checkbox" id="perOcultar" ${ui.ocultarSueldos ? "checked" : ""} style="width:auto"> Ocultar sueldos</label>` : ""}
        <select id="perEst" aria-label="Estado">${[["activos","Activos"],["bajas","Bajas"],["todos","Todos"]].map(([k,l]) => `<option value="${k}" ${ui.personalEstado === k ? "selected" : ""}>${l}</option>`).join("")}</select>
        <button class="b primary" data-act="newPer" ${roOnly()}>Agregar</button></div></div>

  </div>`;
}

function vPagos() {
  const e = S.pagos.find(p => p.id === ui.editing.pago) || {};
  if (ui.formasFor !== (ui.editing.pago || "nuevo")) { ui.formasFor = ui.editing.pago || "nuevo"; ui.formasDraft = formasDe(e).map(f => ({...f})); }
  const fd = ui.formasDraft || [];
  const list = S.pagos.filter(p => ui.pagosEstado === "todos" || (ui.pagosEstado === "pagado" ? p.estado === "Pagado" : p.estado !== "Pagado"))
    .sort((a, b) => (a.vencimiento || "9999") < (b.vencimiento || "9999") ? -1 : (a.vencimiento || "9999") > (b.vencimiento || "9999") ? 1 : (b.monto || 0) - (a.monto || 0));
  const pend = S.pagos.filter(p => p.estado !== "Pagado");
  const tP = pend.filter(p => p.moneda !== "US$").reduce((s, p) => s + restante(p), 0);
  const tU = pend.filter(p => p.moneda === "US$").reduce((s, p) => s + restante(p), 0);
  const venc = pend.filter(p => p.vencimiento && p.vencimiento < today());
  return `
  <div class="grid">
    <div class="card tile"><div class="label">Pendiente en pesos</div><div class="num">${pesos(tP)}</div></div>
    <div class="card tile"><div class="label">Pendiente en dólares</div><div class="num">${usd(tU)}</div><div class="note">= ${pesos(tU * S.cfg.cotizacion)} a $${nf0.format(S.cfg.cotizacion)}</div></div>
    <div class="card tile"><div class="label">Vencidos</div><div class="num ${venc.length ? "neg" : ""}">${venc.length}</div><div class="note">${pend.filter(p => p.monto == null).length} sin monto definido</div></div>
  </div>
  <div class="card"><h3>${e.id ? (e.estado === "Pagado" ? "Detalle del pago" : "Editar pago") : "Nuevo pago o vencimiento"}</h3>
    ${e.estado === "Pagado" && !formasDe(e).length ? `<p class="muted small" style="margin:0 0 10px">Pagado el ${fmtD(e.fechaPago)} · ${esc(e.pagadoDesde ? desdeLbl(e.pagadoDesde) : "sin dato de dónde salió")}. Si cambiás el monto, la fecha o de dónde salió la plata, la app corrige el descuento solo.</p>` : ""}
    <form class="f" id="fPago">
      <label class="fl">Proveedor u organismo<input id="pg_prov" name="proveedor" list="dlProv" required value="${esc(e.proveedor || "")}"></label>
      <datalist id="dlProv">${[...new Set(S.pagos.map(p => p.proveedor).filter(Boolean))].sort().map(n => `<option value="${esc(n)}">`).join("")}</datalist>
      <label class="fl">Tipo<select id="pg_tipo" name="tipo">${opts(["Proveedor","Impuesto o BPS","Personal","Obra","Otro"], e.tipo || "Proveedor")}</select></label>
      <label class="fl wide">Concepto<input id="pg_con" name="concepto" value="${esc(e.concepto || "")}"></label>
      <label class="fl">Monto<input id="pg_monto" name="monto" inputmode="decimal" value="${e.monto ?? ""}" placeholder="Vacío si falta definir"></label>
      <label class="fl">Moneda<select id="pg_mon" name="moneda">${opts(["$","US$"], e.moneda || "$")}</select></label>
      <label class="fl">Vencimiento<input id="pg_venc" name="vencimiento" type="date" value="${esc(e.vencimiento || "")}"></label>
      <label class="fl">Se repite<select id="pg_rep" name="repetir"><option value="" ${e.repetir ? "" : "selected"}>No, es un pago único</option><option value="mensual" ${e.repetir === "mensual" ? "selected" : ""}>Todos los meses</option></select></label>
      <label class="fl pgSimple" ${fd.length ? "hidden" : ""}>Estado<select id="pg_est" name="estado">${opts(["Pendiente","Pagado"], e.estado || "Pendiente")}</select></label>
      <label class="fl pgPag" ${e.estado === "Pagado" && !fd.length ? "" : "hidden"}>Fecha de pago<input id="pg_fpag" name="fechaPago" type="date" value="${esc(e.fechaPago || today())}"></label>
      <label class="fl pgPag" ${e.estado === "Pagado" && !fd.length ? "" : "hidden"}>¿De dónde salió la plata?<select id="pg_desde" name="pagadoDesde">${desdes().map(x => `<option value="${esc(x)}" ${(e.pagadoDesde || "Fondo de dueños") === x ? "selected" : ""}>${esc(desdeLbl(x))}</option>`).join("")}<option value="__nuevo">+ Agregar otra forma de pago…</option></select></label>
      <label class="fl pgPag" id="pg_desdeNL" hidden>Nombre de la nueva forma de pago<input id="pg_desdeN" name="desdeNuevo" placeholder="Ej.: Pagó Fernando"></label>
      <div class="wide"><h3 style="margin:8px 0 4px">Formas de pago</h3>
        <p class="muted small" style="margin:0 0 8px">Para pagar en partes, por ejemplo una entrega y dos cheques. Poné en Monto el total de la deuda y acá cada parte con su fecha de pago (cuándo se transfiere o se entrega el cheque), y tildá Hecha cuando se pague. El vencimiento pasa a ser el de la próxima parte pendiente, y el pago queda pagado recién cuando están todas hechas y suman el total. Mientras tanto sigue en Pendientes por el saldo. El efectivo del fondo o de los retiros se descuenta solo.</p>
        <div id="fpRows">${fpRowsHtml(fd, e.moneda || "$")}</div>
        <div id="fpSuma" class="small" style="margin:4px 0 8px">${fpSumaTxt(fd, e.monto ?? null, e.moneda || "$")}</div>
        <div class="btns"><button class="b small" type="button" data-act="fpAdd">+ Agregar forma de pago</button></div></div>
      <label class="fl wide">Notas<input id="pg_not" name="notas" value="${esc(e.notas || "")}"></label>
      <div class="btns wide"><button class="b primary" type="submit" ${roOnly(e.id ? 3 : 2)}>${e.id ? "Guardar cambios" : "Agregar"}</button>${e.id ? `<button class="b" type="button" data-act="cancelPago">Cancelar</button><button class="b danger" type="button" ${roOnly(3)} data-act="delPago" data-id="${e.id}">Borrar</button>` : ""}</div>
    </form>
  </div>
  <div class="card">
    <div class="toolbar"><h3 style="margin:0">Pagos</h3><select id="pgEst" aria-label="Estado">${[["pendiente","Pendientes"],["pagado","Pagados"],["todos","Todos"]].map(([k,l]) => `<option value="${k}" ${ui.pagosEstado === k ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    ${list.length ? `<div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Vence</th><th>Proveedor</th><th class="n">Monto</th><th></th></tr></thead><tbody>${filasPagos(list, p => `<tr class="click" data-act="editPago" data-id="${p.id}"><td>${p.estado === "Pagado" ? `<span class="pill good">Pagado</span>` : vencPill(p.vencimiento)}</td><td>${esc(p.proveedor)} <span class="muted small">· ${esc(p.tipo || "")}${p.repetir === "mensual" ? " · todos los meses" : ""}</span><div class="muted small">${esc([p.concepto, p.notas].filter(Boolean).join(" · "))}</div>${formasDe(p).length ? `<div class="small">${esc(formasTxt(p))}</div>` : ""}</td><td class="n">${p.monto == null ? '<span class="pill warn">a definir</span>' : money(p.monto, p.moneda)}${formasDe(p).length && p.estado !== "Pagado" ? `<div class="muted small">falta ${money(restante(p), p.moneda)}</div>` : ""}</td><td class="n">${p.estado !== "Pagado" && formasDe(p).length ? `<button class="b small" type="button" data-act="editPago" data-id="${p.id}">Ver formas</button>` : p.estado !== "Pagado" ? (ui.pagando === p.id ? `<div class="small muted" style="margin-bottom:4px">¿De dónde sale la plata?</div><div class="btns" style="justify-content:flex-end"><button class="b small" data-act="pagarDesde" data-id="${p.id}" data-desde="Fondo de dueños">Fondo de dueños</button><button class="b small" data-act="pagarDesde" data-id="${p.id}" data-desde="Retiros de caja">Retiros de caja</button>${desdes().slice(2).map(x => `<button class="b small" data-act="pagarDesde" data-id="${p.id}" data-desde="${esc(x)}">${esc(desdeLbl(x))}</button>`).join("")}<button class="b small" data-act="editPago" data-id="${p.id}" data-nuevo="1">+ Otra forma…</button><button class="b small" data-act="pagarCancel">Cancelar</button></div>` : `<button class="b small" data-act="pagar" data-id="${p.id}" ${roOnly(3)} ${p.monto == null ? "disabled title=\"Primero poné el monto\"" : ""}>Marcar pagado</button>`) : `<span class="muted small">${esc(p.pagadoDesde ? desdeLbl(p.pagadoDesde) : "")}${p.fechaPago ? "<br>" + fmtD(p.fechaPago) : ""}</span><div><button class="b small" type="button" data-act="editPago" data-id="${p.id}">Ver / editar</button></div>`}</td></tr>`)}</tbody></table></div>` : `<div class="empty">No hay pagos en esta lista.</div>`}
  </div>`;
}

/* ---------- eventos ---------- */
document.addEventListener("click", async ev => {
  const tb = ev.target.closest("[data-tab]");
  if (tb) { tab = tb.dataset.tab; ui.editing = {}; render(); window.scrollTo(0, 0); return; }
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const id = el.dataset.id, act = el.dataset.act;
  const conf = async (fn) => { if (el.dataset.confirm) { await fn(); } else { el.dataset.confirm = "1"; el.textContent = "¿Seguro? Tocá de nuevo"; setTimeout(() => { if (el.isConnected) { delete el.dataset.confirm; el.textContent = "Borrar"; } }, 3000); } };
  switch (act) {
    case "editMov": ui.editing.mov = id; render(); $("#fMov").scrollIntoView({block: "center"}); break;
    case "cancelMov": ui.editing.mov = null; render(); break;
    case "pagarMov": if (await patch("movimientos", id, {estado: "Pagado", fecha: today()})) toast("Marcado como pagado hoy, ya se descontó del fondo"); break;
    case "delMov": conf(async () => { await remove("movimientos", id); ui.editing.mov = null; }); break;
    case "goAdel": tab = "adelantos"; ui.editing = {adel: id}; render(); window.scrollTo(0, 0); break;
    case "darAdel": tab = "adelantos"; ui.editing = {}; ui.adelPara = id; render(); window.scrollTo(0, 0); $("#ad_monto")?.focus(); break;
    case "perDesdeAdel": tab = "personal"; ui.editing = {per: "nuevo"}; render(); window.scrollTo(0, 0); break;
    case "editArq": ui.editing.arq = id; render(); break;
    case "cancelArq": ui.editing.arq = null; render(); break;
    case "delArq": conf(async () => { await remove("arqueos", id); ui.editing.arq = null; }); break;
    case "editCF": ui.editing.cf = id; render(); break;
    case "cancelCF": ui.editing.cf = null; render(); break;
    case "delCF": conf(async () => { await remove("cajaFuerte", id); ui.editing.cf = null; }); break;
    case "editAdel": ui.editing.adel = id; render(); window.scrollTo(0, 0); break;
    case "cancelAdel": ui.editing.adel = null; render(); break;
    case "delAdel": conf(async () => { await remove("adelantos", id); ui.editing.adel = null; }); break;
    case "entregar": if (await patch("adelantos", id, {estado: "Entregado", fecha: today()})) toast("Marcado como entregado hoy"); break;
    case "descontar": if (await patch("adelantos", id, {descontado: true, descontadoFecha: today()})) toast("Marcado como descontado"); break;
    case "nodescontar": await patch("adelantos", id, {descontado: false, descontadoFecha: null}); break;
    case "descontarTodos": {
      if (!el.dataset.confirm) { el.dataset.confirm = "1"; const txt = el.textContent; el.textContent = "¿Seguro? Tocá de nuevo para descontar " + el.dataset.n; setTimeout(() => { if (el.isConnected) { delete el.dataset.confirm; el.textContent = txt; } }, 4000); break; }
      el.disabled = true;
      const lst = S.adelantos.filter(a => a.estado === "Entregado" && !a.descontado); let n = 0;
      for (const a of lst) if (await patch("adelantos", a.id, {descontado: true, descontadoFecha: today()})) n++;
      toast(n === lst.length ? `Listo, ${n} adelantos descontados` : `Se descontaron ${n} de ${lst.length}, probá de nuevo`); render();
      break; }
    case "semPrev": ui.semana = addDays(ui.semana, -7); render(); break;
    case "semNext": ui.semana = addDays(ui.semana, 7); render(); break;
    case "verSem": ui.semana = id; render(); window.scrollTo(0, 0); break;
    case "newPer": ui.editing.per = "nuevo"; render(); $("#fPer input[name=nombre]")?.focus(); break;
    case "editPer": ui.editing.per = id; ui.perEditar = false; ui.bajaAbierta = null; render(); window.scrollTo(0, 0); break;
    case "editarPer": ui.perEditar = true; render(); $("#pe_nom")?.focus(); break;
    case "bpsFicha": ev.preventDefault?.(); ui.editing.per = id; ui.perEditar = niv("personal") >= 3; ui.bajaAbierta = null; render(); { const f = $("#fPer") || $(".ficha"); f?.scrollIntoView({block: "start"}); } break;
    case "verPer": ui.perEditar = false; render(); break;
    case "cancelPer": ui.editing.per = null; ui.perEditar = false; ui.bajaAbierta = null; render(); break;
    case "abrirBaja": ui.bajaAbierta = ui.editing.per; render(); $("#bj_mot")?.focus(); break;
    case "cerrarBaja": ui.bajaAbierta = null; render(); break;
    case "bpsOk": marcarBps(id, el.dataset.tipo); break;
    case "bpsUndo": marcarBps(id, el.dataset.tipo, true); break;
    case "bpsVer": ui.bpsVer = !ui.bpsVer; render(); break;
    case "delPer": conf(async () => { await remove("personal", id); ui.editing.per = null; }); break;
    case "guardarProp": guardarPropinas(); break;
    case "editPago": ui.editing.pago = id; ui.pagando = null; render(); window.scrollTo(0, 0);
      if (el.dataset.nuevo) { $("#pg_est").value = "Pagado"; document.querySelectorAll(".pgPag").forEach(x => x.hidden = false); $("#pg_desde").value = "__nuevo"; $("#pg_desdeNL").hidden = false; $("#pg_desdeN").focus(); }
      break;
    case "cancelPago": ui.editing.pago = null; render(); break;
    case "toggleGrupo": if (ui.gruposAbiertos.has(id)) ui.gruposAbiertos.delete(id); else ui.gruposAbiertos.add(id); render(); break;
    case "fpAdd": { const fs = leerFormas(); const tot = numIn($("#pg_monto").value); const falta = tot == null ? null : Math.round((tot - sumaFormas(fs)) * 100) / 100;
      fs.push({tipo: "Cheque", monto: falta > 0 ? falta : null, fecha: null, hecha: false}); $("#fpRows").innerHTML = fpRowsHtml(fs, $("#pg_mon").value); fpRefresh(); break; }
    case "fpDel": { const fs = leerFormas(); fs.splice(Number(el.dataset.i), 1); $("#fpRows").innerHTML = fpRowsHtml(fs, $("#pg_mon").value); fpRefresh(); break; }
    case "delPago": conf(async () => { await quitarSalidas(id); await remove("pagos", id); ui.editing.pago = null; }); break;
    case "pagar": ui.pagando = id; render(); break;
    case "pagarCancel": ui.pagando = null; render(); break;
    case "pagarDesde": {
      const pg = S.pagos.find(x => x.id === id); if (!pg || pg.monto == null) break;
      const desde = el.dataset.desde;
      const ok = await registrarSalida(pg, desde, today());
      if (ok && await patch("pagos", id, {estado: "Pagado", fechaPago: today(), pagadoDesde: desde})) { ui.pagando = null; toast(desde === "Fondo de dueños" || desde === "Retiros de caja" ? "Pagado y descontado de " + desde : "Marcado como pagado (" + desdeLbl(desde) + ")"); render(); await crearSiguiente(pg); }
      break; }
    case "driveOk": if (await patch("pendientesDrive", id, {resuelto: true, resueltoFecha: today()})) toast("Marcado como cargado. Se puede deshacer abajo"); break;
    case "driveUndo": if (await patch("pendientesDrive", id, {resuelto: false})) toast("Volvió a pendientes"); break;
    case "exportJson": exportar("json"); break;
    case "exportCsv": exportar("csv", id); break;
  }
});
document.addEventListener("submit", async ev => {
  ev.preventDefault();
  const f = ev.target, d = formData(f);
  if (f.id === "fMov") {
    const monto = numIn(d.monto); if (monto == null || monto <= 0) { toast("Poné un monto válido"); return; }
    if (d.categoria === "__nuevo") { d.categoria = (d.catNueva || "").trim(); if (!d.categoria) { toast("Poné el nombre de la categoría nueva"); return; } if (!catsAll().map(norm).includes(norm(d.categoria))) await marcarNuevo("Categoría", d.categoria, "Fondo de dueños"); }
    if (d.persona.trim() && !conocidos().has(norm(d.persona))) await marcarNuevo("Persona o proveedor", d.persona.trim(), "Fondo de dueños");
    const old = S.movimientos.find(m => m.id === ui.editing.mov) || {};
    const rec = {fecha: d.fecha, turno: d.turno, tipo: d.tipo, categoria: d.categoria, concepto: d.concepto.trim(), persona: d.persona.trim(), monto, moneda: d.moneda, cotizacion: d.moneda === "US$" ? (old.cotizacion || S.cfg.cotizacion) : null, formaPago: d.formaPago, estado: d.tipo === "Ingreso" ? "Pagado" : (d.estado || "Pagado"), notas: d.notas.trim(), cargadoPor: old.cargadoPor || S.perfil?.nombre || ""};
    if (await save("movimientos", ui.editing.mov, rec)) { toast(ui.editing.mov ? "Movimiento actualizado" : "Movimiento agregado"); ui.editing.mov = null; render(); }
  } else if (f.id === "fArq") {
    const contado = numIn(d.contado); if (contado == null) { toast("Poné el efectivo contado"); return; }
    const rec = {fecha: d.fecha, cuenta: d.cuenta || "Fondo de dueños", responsable: d.responsable.trim(), saldoSistema: numIn(d.saldoSistema), contado, saldoUsd: d.saldoUsd != null ? numIn(d.saldoUsd) : null, contadoUsd: d.contadoUsd != null ? numIn(d.contadoUsd) : null, comentario: d.comentario.trim()};
    if (await save("arqueos", ui.editing.arq, rec)) { toast("Arqueo registrado"); ui.editing.arq = null; render(); }
  } else if (f.id === "fCF") {
    const p = numIn(d.pesos), u = numIn(d.dolares); if (!p && !u) { toast("Poné pesos o dólares"); return; }
    const old = S.cajaFuerte.find(x => x.id === ui.editing.cf) || {};
    const rec = {fecha: d.fecha, tipo: d.tipo, pesos: p, dolares: u, cotizacion: u ? (old.cotizacion || S.cfg.cotizacion) : null, motivo: d.motivo.trim()};
    if (await save("cajaFuerte", ui.editing.cf, rec)) { toast("Guardado"); ui.editing.cf = null; render(); }
  } else if (f.id === "fAdel") {
    const monto = numIn(d.monto); const per = S.personal.find(p => p.id === d.personaId);

async function exportar(kind, col) {

}

function makeDb() {
  const timers = {}, loaders = {};
  const after = c => { if (loaders[c]) loaders[c](); };
  const docRef = (c, id) => ({
    set: async v => { const {error} = await sb.from(c).upsert({...v, id}); if (error) throw error; after(c); },
    update: async v => { const {error} = await sb.from(c).update(v).eq("id", id); if (error) throw error; after(c); },
    delete: async () => { const {error} = await sb.from(c).delete().eq("id", id); if (error) throw error; after(c); },
    onSnapshot: (cb, err) => {
      const load = async () => { const {data, error} = await sb.from(c).select("*").eq("id", id).maybeSingle(); if (error) { err && err(error); return; } cb({exists: !!data, data: () => data, metadata: {fromCache: false}}); };
      load(); const ch = sb.channel("rt-" + c + "-" + id).on("postgres_changes", {event: "*", schema: "public", table: c}, () => load()).subscribe();
      return () => sb.removeChannel(ch);
    }
  });
  return {
    collection: c => ({
      doc: id => docRef(c, id),
      onSnapshot: (cb, err) => {
        const load = async () => {
          const {data, error} = await sb.from(c).select("*").limit(10000);
          if (error) { err && err(error); return; }
          cb({docs: data.map(r => { const {id, ...rest} = r; return {id, data: () => rest}; }), metadata: {fromCache: false}});
        };
        loaders[c] = load; load();
        const ch = sb.channel("rt-" + c).on("postgres_changes", {event: "*", schema: "public", table: c}, () => { clearTimeout(timers[c]); timers[c] = setTimeout(load, 200); }).subscribe();
        return () => sb.removeChannel(ch);
      }
    }),
    doc: p => { const [c, id] = p.split("/"); return docRef(c, id); }
  };
}

  arrancado = true;
  db = makeDb();
  $("#main").innerHTML = `<div class="card empty">Cargando los datos de la base…</div>`;
  let pending = COLS.length + 1;
  const timer = setTimeout(() => { $("#syncNote").textContent = "La base tarda en responder"; }, 10000);
  const done = () => { if (--pending <= 0) { clearTimeout(timer); $("#syncNote").textContent = S.canWrite ? "Al día" : "Solo lectura"; } };
  COLS.forEach(col => {
    let first = true;
    db.collection(col).onSnapshot(snap => {
      S[col] = snap.docs.map(d => ({id: d.id, ...d.data()}));
      if (col === "personal" || col === "personalPrivado") mergePriv();
      if (first) { first = false; done(); }
      render();
    }, err => { if (first) { first = false; done(); } $("#syncNote").textContent = "Error de conexión"; });
  });
  let firstCfg = true;
  db.doc("config/general").onSnapshot(s => { if (s.exists) S.cfg = {cotizacion: 41, diasAcreditacion: 15, ...s.data()}; if (firstCfg) { firstCfg = false; done(); } render(); }, () => { if (firstCfg) { firstCfg = false; done(); } });
  if (perfil.rol === "admin") cargarPerfiles();
}
$("#btnSalir").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });
arrancar();
})();
</script>
